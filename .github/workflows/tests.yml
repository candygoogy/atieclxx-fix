name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Logic.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\Test-Logic.ps1
